baseURL = "https://max.busboom.org/"
languageCode = "en-us"
title = "Max Busboom"
theme = "wp-static"

[pagination]
pagerSize = 10

# Blog posts live in year folders (/2016/10/25/...), so their type would be
# the year. Give them all type "post" for the post lists.
[[cascade]]
type = "post"
[cascade.target]
path = "{/20*/**}"

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
style = "friendly"

[params]
description = "Hey Grumpy, Get Your Feet off the Internet"
blogHomepage = true
sidebar = false
accentColor = "#555"

[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
name = "About"
url = "/about/"
weight = 2
